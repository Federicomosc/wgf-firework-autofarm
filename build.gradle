plugins {
    id 'fabric-loom' version '1.1.14'
    id 'maven-publish'
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
    flatDir { dirs 'libs' }
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Meteor Client - JAR locale (metti meteor-client-0.5.1.jar nella cartella libs/)
    // FIX CRASH: usiamo compileOnly invece di modImplementation
    // per evitare che Loom tenti di remappare il JAR (questo causa
    // il crash JVM su PC con poca RAM o su Windows con Loom 1.1.14).
    // A runtime Meteor Client deve essere presente in .minecraft/mods/
    compileOnly name: 'meteor-client-0.5.1'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}
